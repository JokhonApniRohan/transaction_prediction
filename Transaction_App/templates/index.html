<!DOCTYPE html>
<html>
<head>
    <title>Transaction Prediction</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #f5f7fb;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* LOGO */
        .logo {
            position: absolute;
            top: 20px;
            right: 30px;
            z-index: 10;
        }

        .logo img {
            height: 100px; /* adjust as needed */
            object-fit: contain;
        }

        /* LEFT PANEL */
        .left {
            width: 42%;
            background: linear-gradient(135deg, #0000cc, #3b3bff);
            color: white;
            padding: 70px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;

            animation: slideLeft 0.8s ease;
        }

        .left::after {
            content: "";
            position: absolute;
            bottom: -100px;
            right: -100px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #FFD34C, transparent);
            opacity: 0.25;
        }

        .left h1 {
            font-size: 36px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 15px;
        }

        .left p {
            opacity: 0.85;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        /* RIGHT PANEL */
        .right {
            width: 58%;
            padding: 70px 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;

            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);

            animation: fadeIn 1s ease;
        }

        .data-row {
            margin-bottom: 40px;
        }

        .label {
            font-size: 11px;
            color: #8a94a6;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .value {
            font-size: 28px;
            font-weight: 600;
            color: #0f172a;
            letter-spacing: -0.5px;
        }

        /* Prediction Highlight */
        .prediction {
            margin-top: 30px;
            padding: 25px;
            border-radius: 14px;

            background: linear-gradient(135deg, #ffffff, #f9fbff);
            box-shadow: 0 15px 40px rgba(0, 0, 204, 0.08);

            position: relative;
            overflow: hidden;
        }

        .prediction::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 6px;
            height: 100%;
            background: #FFD34C;
        }

        .prediction .label {
            color: #0000cc;
        }

        .prediction .value {
            font-size: 42px;
            color: #0000cc;
        }

        .value span {
            position: relative;
        }

        .value span::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -6px;
            width: 100%;
            height: 6px;
            background: #FFD34C;
            z-index: -1;

            transform: scaleX(0);
            transform-origin: left;
            animation: underline 0.8s ease forwards;
        }

        .prediction:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 50px rgba(0, 0, 204, 0.12);
        }

        /* Animations */
        @keyframes slideLeft {
            from {
                transform: translateX(-60px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes underline {
            to {
                transform: scaleX(1);
            }
        }

    </style>
</head>

<body>

    <!-- LOGO (Replace src with your company logo) -->
    <div class="logo">
        <img src="static\images.png" alt="Company Logo">
    </div>

    <!-- LEFT SIDE -->
    <div class="left">
        <h1>Next Day<br>Transaction Prediction</h1>
        <p>AI-powered transaction forecasting system</p>
    </div>

    <!-- RIGHT SIDE -->
    <div class="right">

        <div class="data-row">
            <div class="label">Yesterday's Date</div>
            <div class="value"><span>{{ result.date }}</span></div>
        </div>

        <div class="data-row">
            <div class="label">Yesterday's Transaction</div>
            <div class="value">
                <span>৳ {{ "{:,.0f}".format(result.current) }}</span>
            </div>
        </div>

        <div class="prediction">
            <div class="label">Prediction for the Next Day</div>
            <div class="value">
                <span>৳ {{ "{:,.0f}".format(result.next_day) }}</span>
            </div>
        </div>

    </div>

</body>
</html>
